# Small author-written rules for the authored testbed. They are not Semgrep's
# general-purpose packs; report their contribution separately from p/secrets.
rules:
  - id: rnsec-benchmark-asyncstorage-sensitive
    languages: [javascript, typescript]
    message: Sensitive-looking value passed to AsyncStorage
    severity: WARNING
    pattern: AsyncStorage.setItem("token", $VALUE)

  - id: rnsec-benchmark-sensitive-console
    languages: [javascript, typescript]
    message: Sensitive-looking value passed to console output
    severity: WARNING
    pattern-either:
      - pattern: console.log("token", $VALUE)
      - pattern: console.info("token", $VALUE)
      - pattern: console.warn("token", $VALUE)
      - pattern: console.error("token", $VALUE)
      - pattern: console.debug("token", $VALUE)

  - id: rnsec-benchmark-cleartext-http
    languages: [javascript, typescript]
    message: Cleartext HTTP URL
    severity: WARNING
    pattern-regex: http://api\.example\.test/data
